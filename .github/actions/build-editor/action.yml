name: Build editor
description: Install dependencies and build the editor with a configurable live URL base

inputs:
  live-url-base:
    description: Base URL for the live site link in the editor sidebar
    required: false
    default: "/inb4doc"
  editor-self-base:
    description: Base URL path where the editor is deployed (e.g. /inb4doc/editor-live/)
    required: false
    default: ""
  build-mode:
    description: Editor build mode (web-remote, web-local, gui-desktop, gui-mobile)
    required: false
    default: "web-remote"
  update-base:
    description: Update base URL the fetch updater pulls the live editor from (per-buildmode deployment subdir)
    required: false
    default: ""
  output-path:
    description: Directory (relative to repo root) to copy the built editor/public/ into. Leave empty to skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache Bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ hashFiles('editor/bun.lock', 'editor/package.json', '.github/actions/build-editor/action.yml') }}
        restore-keys: |
          bun-

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Build editor
      working-directory: editor
      shell: bash
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        LIVE_URL_BASE: ${{ inputs.live-url-base }}
        EDITOR_SELF_BASE: ${{ inputs.editor-self-base }}
        UPDATE_BASE: ${{ inputs.update-base }}
      run: |
        bun install --frozen-lockfile
        bun run build

    # Every build writes to editor/public/, so concurrent/sequential calls
    # overwrite each other. Snapshot each build into its own directory here so
    # the workflow assembles the site from distinct, atomic outputs.
    - name: Copy editor output
      if: ${{ inputs.output-path != '' }}
      shell: bash
      run: |
        mkdir -p "$OUTPUT_PATH"
        cp -r editor/public/. "$OUTPUT_PATH/"
      env:
        OUTPUT_PATH: ${{ inputs.output-path }}
