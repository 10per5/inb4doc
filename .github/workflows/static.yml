name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build-editor
        with:
          live-url-base: /inb4doc
          editor-self-base: https://10per5.github.io/inb4doc/editor-live/
          build-mode: web-remote
          output-path: build/editor-web

      - uses: ./.github/actions/build-editor
        with:
          live-url-base: /inb4doc
          build-mode: gui-desktop
          update-base: https://10per5.github.io/inb4doc/editor-live/desktop
          output-path: build/editor-desktop

      - uses: ./.github/actions/build-editor
        with:
          live-url-base: /inb4doc
          build-mode: gui-mobile
          update-base: https://10per5.github.io/inb4doc/editor-live/mobile
          output-path: build/editor-mobile

      - uses: ./.github/actions/build-hugo
        with:
          baseurl: /inb4doc/
          editor-url: /inb4doc/editor-live
          site-url: https://10per5.github.io/inb4doc

      - name: Load PREDEP SHA
        id: predep-copy-images-sha
        shell: bash
        run: |
          echo "sha=$(sed -n 's/^package: //p' .github/predep-shas.yml)" >> $GITHUB_OUTPUT

      - name: Copy content images into Hugo output
        shell: bash
        run: predep --privileged ${{ steps.predep-copy-images-sha.outputs.sha }} copy-images

      # Assemble the three per-mode editor builds into the site output. Each
      # build-editor call snapshots into its own directory (output-path), so the
      # root /editor-live gets the web-remote build and never a stale overwrite.
      - name: Copy editor builds into site output
        shell: bash
        run: |
          mkdir -p hugo-view/build/editor-live
          cp -r build/editor-web/. hugo-view/build/editor-live
          mkdir -p hugo-view/build/editor-live/desktop
          cp -r build/editor-desktop/. hugo-view/build/editor-live/desktop
          mkdir -p hugo-view/build/editor-live/mobile
          cp -r build/editor-mobile/. hugo-view/build/editor-live/mobile

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hugo-view/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
